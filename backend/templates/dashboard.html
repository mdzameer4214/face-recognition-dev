<!DOCTYPE html>
<html>

<head>

    <title>Enterprise Face Recognition</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial;
        }

        body{
            background:#0f172a;
            color:white;
            padding:30px;
        }

        .header{
            margin-bottom:30px;
        }

        .header h1{
            font-size:40px;
            color:#38bdf8;
        }

        .cards{
            display:flex;
            gap:20px;
            margin-bottom:30px;
        }

        .card{
            background:#1e293b;
            padding:20px;
            border-radius:15px;
            width:250px;
            box-shadow:0 0 10px rgba(0,0,0,0.3);
        }

        .card h2{
            font-size:18px;
            margin-bottom:10px;
        }

        .card p{
            font-size:30px;
            font-weight:bold;
            color:#38bdf8;
        }

        .camera-section{
            margin-bottom:30px;
        }

        .camera-section h2{
            margin-bottom:15px;
        }

        .camera-feed{
            width:700px;
            border-radius:15px;
            border:4px solid #38bdf8;
        }

        table{
            width:100%;
            border-collapse:collapse;
            background:white;
            color:black;
            border-radius:10px;
            overflow:hidden;
        }

        th{
            background:#38bdf8;
            padding:15px;
        }

        td{
            padding:12px;
            border-bottom:1px solid #ddd;
            text-align:center;
        }

        tr:hover{
            background:#f1f5f9;
        }

    </style>

</head>

<body>

    <div class="header">

        <h1>
            Enterprise Face Recognition Dashboard
        </h1>

    </div>


    <div class="cards">

        <div class="card">

            <h2>Total Employees</h2>

            <p>{{ total }}</p>

        </div>

        <div class="card">

            <h2>Today's Attendance</h2>

            <p>{{ today }}</p>

        </div>

    </div>


    <div class="camera-section">

        <h2>Live Camera Feed</h2>

        <img
            src="/video_feed"
            class="camera-feed"
        >

    </div>


    <table>

        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Date</th>
            <th>First IN</th>
            <th>Last OUT</th>
        </tr>

        {% for row in attendance %}

        <tr>

            <td>{{ row.id }}</td>
            <td>{{ row.name }}</td>
            <td>{{ row.date }}</td>
            <td>{{ row.first_in }}</td>
            <td>{{ row.last_out }}</td>

        </tr>

        {% endfor %}

    </table>

</body>
</html>
