<!DOCTYPE html>
<html>

<head>

    <title>Enterprise Face Recognition</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial;
        }

        body{
            background:#0f172a;
            color:white;
            padding:30px;
        }

        .header{
            margin-bottom:30px;
        }

        .header h1{
            font-size:40px;
            color:#38bdf8;
        }

        .cards{
            display:flex;
            gap:20px;
            margin-bottom:30px;
        }

        .card{
            background:#1e293b;
            padding:20px;
            border-radius:15px;
            width:250px;
        }

        .card h2{
            margin-bottom:10px;
        }

        .card p{
            font-size:30px;
            color:#38bdf8;
            font-weight:bold;
        }

        .camera{
            margin-bottom:30px;
        }

        .camera img{
            width:700px;
            border-radius:15px;
            border:4px solid #38bdf8;
        }

        table{
            width:100%;
            border-collapse:collapse;
            background:white;
            color:black;
            border-radius:10px;
            overflow:hidden;
        }

        th{
            background:#38bdf8;
            padding:15px;
        }

        td{
            padding:12px;
            border-bottom:1px solid #ddd;
            text-align:center;
        }

    </style>

</head>

<body>

    <div class="header">

        <h1>
            Enterprise Face Recognition Dashboard
        </h1>

    </div>


    <div class="cards">

        <div class="card">

            <h2>Total Employees</h2>

            <p id="total-count">
                {{ total }}
            </p>

        </div>

        <div class="card">

            <h2>Today's Attendance</h2>

            <p id="today-count">
                {{ today }}
            </p>

        </div>

    </div>


    <div class="camera">

        <h2 style="margin-bottom:15px;">
            Live AI Camera
        </h2>

        <img src="/video_feed">

    </div>


    <table>

        <thead>

            <tr>

                <th>ID</th>
                <th>Name</th>
                <th>Date</th>
                <th>First IN</th>
                <th>Last OUT</th>

            </tr>

        </thead>

        <tbody id="attendance-body">

            {% for row in attendance %}

            <tr>

                <td>{{ row.id }}</td>
                <td>{{ row.name }}</td>
                <td>{{ row.date }}</td>
                <td>{{ row.first_in }}</td>
                <td>{{ row.last_out }}</td>

            </tr>

            {% endfor %}

        </tbody>

    </table>


<script>

async function loadAttendance(){

    const response = await fetch("/attendance")

    const data = await response.json()

    const table = document.getElementById(
        "attendance-body"
    )

    table.innerHTML = ""

    data.forEach(row => {

        table.innerHTML += `

        <tr>

            <td>${row.id}</td>
            <td>${row.name}</td>
            <td>${row.date}</td>
            <td>${row.first_in}</td>
            <td>${row.last_out}</td>

        </tr>

        `

    })

}

setInterval(
    loadAttendance,
    3000
)

</script>

</body>
</html>
